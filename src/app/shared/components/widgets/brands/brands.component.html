<div class="container py-4">
  <h5 class="bg-dark text-white p-4 text-center">{{ "our_brands" | translate }}</h5>
  <div class="row g-3 mt-2 justify-content-center">
    @for (brand of brands; track $index) {
  
    <div class="col-6 col-md-3 col-lg-2" (click)="redirect(brand.collection)" style="cursor: pointer;"> 
        <div class="border rounded-3 bg-white d-flex align-items-center justify-content-center p-3 shadow-sm brand-card">
          <img [src]="brand.lien" [alt]="brand.position" class="img-fluid brand-logo">
        </div>
    </div>
  }

  </div>
</div>
